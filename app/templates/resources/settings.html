{% extends "base.html" %}

{% block title %}設定 | URL Archive{% endblock %}

{% block content %}
<div class="workspace-stack">
    <section class="page-header">
        <div>
            <h1>設定</h1>
            <p class="page-subtitle">タグ管理やジョブ確認など、運用に関わる設定をまとめています。</p>
        </div>
    </section>

    <div class="settings-grid">
        <section class="panel settings-card">
            <h2>タグ管理</h2>
            <p>登録済みタグは {{ tag_count }} 件です。色や並び順も編集できます。</p>
            <a href="{% url 'tags:list' %}" class="button button--primary">タグを管理する</a>
        </section>

        <section class="panel settings-card">
            <h2>ジョブ管理</h2>
            <p>キュー中または再試行待ちのジョブは {{ queued_job_count }} 件です。総ジョブ数は {{ job_count }} 件です。</p>
            <a href="{% url 'jobs:list' %}" class="button button--primary">ジョブを確認する</a>
        </section>
    </div>

</div>
{% endblock %}
