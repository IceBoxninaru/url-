[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    ".venv-linux",
    "storage",
    "staticfiles",
    "tmp",
    "tmp_mobile_checks",
]

[tool.ruff.lint]
# Phase 0 baseline: catch syntax/undefined-name failures without forcing broad style churn yet.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
"app/resources/services/__init__.py" = ["F401"]
"app/resources/views/__init__.py" = ["F401"]
